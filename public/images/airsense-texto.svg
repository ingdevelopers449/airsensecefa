<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 285 32" width="100%" height="100%">
  <defs>
    <!-- Gradiente Verde para "Air" -->
    <linearGradient id="airGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78cb27" />
      <stop offset="100%" stop-color="#39A900" />
    </linearGradient>

    <!-- Gradiente Azul para "Sense" -->
    <linearGradient id="senseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007ecc" />
      <stop offset="100%" stop-color="#0056ad" />
    </linearGradient>
  </defs>

  <!-- Solo: AirSense CEFA con caja ajustada -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="35" font-size="40" letter-spacing="-0.5">
      <tspan fill="url(#airGrad)" font-weight="800">Air</tspan><tspan fill="url(#senseGrad)" font-weight="800">Sense</tspan><tspan dx="6" fill="#002544" font-weight="900" letter-spacing="0.5">CEFA</tspan>
    </text>
  </g>
</svg>
