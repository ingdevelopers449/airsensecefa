<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <!-- Filtro Sombra Suave -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001824" flood-opacity="0.35"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primaryCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00324D"/>
      <stop offset="100%" stop-color="#001F30"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>
    <linearGradient id="senaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fd600"/>
      <stop offset="100%" stop-color="#39A900"/>
    </linearGradient>
    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
  </defs>

  <!-- Tarjeta Central: Nodo IoT ESP32 -->
  <g filter="url(#cardShadow)">
    <rect x="155" y="45" width="210" height="230" rx="20" fill="url(#primaryCard)" stroke="#005a8a" stroke-width="2"/>
  </g>

  <!-- Header del Nodo -->
  <rect x="175" y="65" width="170" height="34" rx="8" fill="rgba(255,255,255,0.08)"/>
  <circle cx="192" cy="82" r="5" fill="#39A900" filter="url(#glowGreen)"/>
  <text x="207" y="87" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">NODO IOT &bull; ESP32</text>

  <!-- Indicador Wi-Fi y Estado -->
  <path d="M 322 79 A 8 8 0 0 1 334 79 M 325 82 A 4 4 0 0 1 331 82 M 328 85 A 1 1 0 0 1 328 85" fill="none" stroke="#39A900" stroke-width="2" stroke-linecap="round"/>

  <!-- Chip Central Microcontrolador -->
  <rect x="220" y="115" width="80" height="80" rx="10" fill="#0d1b2a" stroke="#39A900" stroke-width="1.5"/>
  <rect x="238" y="133" width="44" height="44" rx="6" fill="#1b263b"/>
  <text x="260" y="153" text-anchor="middle" fill="#39A900" font-family="system-ui, sans-serif" font-size="9" font-weight="800">AIRSENSE</text>
  <text x="260" y="165" text-anchor="middle" fill="#8ecae6" font-family="system-ui, sans-serif" font-size="8" font-weight="600">CEFA CORE</text>

  <!-- Pines del Chip -->
  <line x1="212" y1="130" x2="220" y2="130" stroke="#ffd166" stroke-width="2"/>
  <line x1="212" y1="145" x2="220" y2="145" stroke="#ffd166" stroke-width="2"/>
  <line x1="212" y1="160" x2="220" y2="160" stroke="#ffd166" stroke-width="2"/>
  <line x1="212" y1="175" x2="220" y2="175" stroke="#ffd166" stroke-width="2"/>

  <line x1="300" y1="130" x2="308" y2="130" stroke="#ffd166" stroke-width="2"/>
  <line x1="300" y1="145" x2="308" y2="145" stroke="#ffd166" stroke-width="2"/>
  <line x1="300" y1="160" x2="308" y2="160" stroke="#ffd166" stroke-width="2"/>
  <line x1="300" y1="175" x2="308" y2="175" stroke="#ffd166" stroke-width="2"/>

  <!-- Estado de Telemetría en el Nodo -->
  <rect x="175" y="212" width="170" height="46" rx="10" fill="rgba(0,0,0,0.3)"/>
  <text x="187" y="230" fill="#90e0ef" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TELEMETRÍA EN VIVO</text>
  <text x="187" y="247" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">480 PPM &bull; 23.8°C</text>
  <circle cx="330" cy="235" r="4" fill="#39A900" filter="url(#glowGreen)"/>

  <!-- Conectores Curvos Dinámicos -->
  <!-- Conector Izquierdo hacia Sensor CO2 -->
  <path d="M 155 125 C 105 125, 100 85, 75 85" fill="none" stroke="#39A900" stroke-width="2.5" stroke-dasharray="4 3"/>
  <!-- Conector Izquierdo hacia Sensor Temp/Hum -->
  <path d="M 155 200 C 105 200, 100 235, 75 235" fill="none" stroke="#00b4d8" stroke-width="2.5" stroke-dasharray="4 3"/>
  <!-- Conector Derecho hacia IA / Predicción -->
  <path d="M 365 125 C 410 125, 415 85, 445 85" fill="none" stroke="#39A900" stroke-width="2.5"/>
  <!-- Conector Derecho hacia Semáforo SST -->
  <path d="M 365 200 C 410 200, 415 235, 445 235" fill="none" stroke="#fb8500" stroke-width="2.5"/>

  <!-- Sensor Izquierdo 1: MH-Z19B (CO2) -->
  <g filter="url(#cardShadow)">
    <rect x="15" y="55" width="125" height="70" rx="14" fill="url(#sensorGrad)" stroke="#39A900" stroke-width="2"/>
    <circle cx="38" cy="80" r="14" fill="#e8f5e9"/>
    <text x="38" y="85" text-anchor="middle" fill="#39A900" font-family="system-ui, sans-serif" font-size="11" font-weight="900">CO₂</text>
    <text x="60" y="77" fill="#00324D" font-family="system-ui, sans-serif" font-size="11" font-weight="800">MH-Z19B</text>
    <text x="60" y="92" fill="#555" font-family="system-ui, sans-serif" font-size="9">Infrarrojo NDIR</text>
    <text x="60" y="107" fill="#39A900" font-family="system-ui, sans-serif" font-size="11" font-weight="700">400 - 5000 ppm</text>
  </g>

  <!-- Sensor Izquierdo 2: DHT22 (Temp & Humedad) -->
  <g filter="url(#cardShadow)">
    <rect x="15" y="200" width="125" height="70" rx="14" fill="url(#sensorGrad)" stroke="#00b4d8" stroke-width="2"/>
    <circle cx="38" cy="225" r="14" fill="#e0f7fa"/>
    <text x="38" y="230" text-anchor="middle" fill="#0077b6" font-family="system-ui, sans-serif" font-size="12" font-weight="900">°C</text>
    <text x="60" y="222" fill="#00324D" font-family="system-ui, sans-serif" font-size="11" font-weight="800">DHT22</text>
    <text x="60" y="237" fill="#555" font-family="system-ui, sans-serif" font-size="9">Temp &amp; Humedad</text>
    <text x="60" y="252" fill="#0077b6" font-family="system-ui, sans-serif" font-size="11" font-weight="700">&plusmn;0.5°C &bull; 0-100%</text>
  </g>

  <!-- Módulo Derecho 1: Inteligencia Artificial -->
  <g filter="url(#cardShadow)">
    <rect x="380" y="55" width="125" height="70" rx="14" fill="url(#sensorGrad)" stroke="#39A900" stroke-width="2"/>
    <circle cx="403" cy="80" r="14" fill="#e8f5e9"/>
    <text x="403" y="85" text-anchor="middle" fill="#39A900" font-family="system-ui, sans-serif" font-size="12" font-weight="900">IA</text>
    <text x="424" y="77" fill="#00324D" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Modelo IA</text>
    <text x="424" y="92" fill="#555" font-family="system-ui, sans-serif" font-size="9">Predicción 15m</text>
    <text x="424" y="107" fill="#39A900" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Anticipa picos</text>
  </g>

  <!-- Módulo Derecho 2: Semáforo & Alertas SST -->
  <g filter="url(#cardShadow)">
    <rect x="380" y="200" width="125" height="70" rx="14" fill="url(#sensorGrad)" stroke="#fb8500" stroke-width="2"/>
    <!-- Semáforo mini -->
    <rect x="393" y="213" width="18" height="44" rx="9" fill="#1b263b"/>
    <circle cx="402" cy="223" r="4" fill="#ef476f"/>
    <circle cx="402" cy="235" r="4" fill="#ffd166"/>
    <circle cx="402" cy="247" r="4" fill="#06d6a0" filter="url(#glowGreen)"/>

    <text x="420" y="222" fill="#00324D" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Semáforo SST</text>
    <text x="420" y="237" fill="#555" font-family="system-ui, sans-serif" font-size="9">Alertas en vivo</text>
    <text x="420" y="252" fill="#fb8500" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Ventilación aula</text>
  </g>

  <!-- Badge Inferior: Telemetría 100% Automática -->
  <rect x="180" y="300" width="160" height="30" rx="15" fill="#ffffff" filter="url(#cardShadow)"/>
  <circle cx="197" cy="315" r="5" fill="#39A900"/>
  <text x="210" y="319" fill="#00324D" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Muestreo cada 60 seg</text>
</svg>
